name: Bug report
description: Report a reproducible problem in Motion Studio.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain the problem without credentials or personal data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include commands and a minimal example where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, browser, commit and relevant tool versions.
    validations:
      required: true
